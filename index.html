<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Darwin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #efe9db;
      }
      a {
        color: #4a7c59;
      }
      a:hover {
        color: #3d6a4b;
      }
      .lab {
        text-transform: uppercase;
      }
      /* #app fills the viewport and clips; .scale-root is sized to the design's
         fixed 1180px layout and is scaled + centred to fit whatever viewport is
         available, so nothing ever needs to scroll (main.ts computes the
         transform). */
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .scale-root {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: top left;
      }
      /* No fixed width here (unlike .plate-frame/.footnote, which are pinned
         to the 1180px design): the tab bar can outgrow 1180px as more
         environments are added, so .page shrink-wraps to whichever is wider —
         the header row or the 1180px plate — instead of clipping tabs. */
      .page {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 24px 56px;
        box-sizing: border-box;
      }
      .header-row {
        min-width: 1180px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 40px;
        margin-bottom: 22px;
      }
      .title {
        font: 600 13px "JetBrains Mono", monospace;
        color: #1c1b17;
        letter-spacing: 0.2em;
      }
      .subtitle {
        margin-top: 5px;
        font: 400 10px "JetBrains Mono", monospace;
        color: rgba(28, 27, 23, 0.48);
        letter-spacing: 0.14em;
      }
      .tabs {
        display: flex;
        flex-shrink: 0;
        gap: 0;
        border: 1px solid rgba(28, 27, 23, 0.35);
        border-radius: 2px;
        overflow: hidden;
      }
      .tab {
        cursor: pointer;
        user-select: none;
        padding: 9px 16px;
        font: 500 10.5px "JetBrains Mono", monospace;
        letter-spacing: 0.08em;
        color: #1c1b17;
        background: transparent;
        white-space: nowrap;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      .tab-bordered {
        border-left: 1px solid rgba(28, 27, 23, 0.35);
      }
      .tab-active {
        color: #efe9db;
        background: #1c1b17;
      }
      .tab-numeral {
        opacity: 0.5;
        margin-right: 7px;
      }
      .plate-frame {
        width: 1180px;
        border-radius: 3px;
        overflow: hidden;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.18);
      }
      .plate {
        position: relative;
        width: 1180px;
        height: 740px;
        background: #efe9db;
        overflow: hidden;
      }
      .plate canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      .plate-label {
        position: absolute;
        top: 32px;
        left: 40px;
      }
      .plate-summary {
        margin-top: 4px;
        font: 400 10px "JetBrains Mono", monospace;
        color: rgba(28, 27, 23, 0.5);
        letter-spacing: 0.06em;
      }
      .plate-readout {
        position: absolute;
        top: 32px;
        right: 40px;
        text-align: right;
        font: 400 10px "JetBrains Mono", monospace;
        color: rgba(28, 27, 23, 0.6);
        letter-spacing: 0.06em;
      }
      .footnote {
        width: 1180px;
        margin: 20px 0 0;
        font: 11px/1.7 "JetBrains Mono", monospace;
        color: rgba(28, 27, 23, 0.45);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
