<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Darwin</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1020;
        color: #e5e7eb;
      }
      #app {
        width: min(92vw, 640px);
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      h1 {
        color: #818cf8;
        font-size: 1.25rem;
        letter-spacing: 0.05em;
        margin: 0;
      }
      select {
        background: #111a33;
        color: #e5e7eb;
        border: 1px solid #1e2a4a;
        border-radius: 6px;
        padding: 0.5rem 0.75rem;
        font-family: inherit;
        font-size: 0.9rem;
      }
      canvas {
        width: 100%;
        border-radius: 8px;
        display: block;
      }
      .meta {
        color: #94a3b8;
        font-size: 0.85rem;
        line-height: 1.6;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
